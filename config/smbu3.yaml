defaults:
  - ./base.yaml

skip_train: True
skip_test: False
skip_mesh: False
skip_cull: False
render_path: False
# case_name: Barn
# case_name: Truck
# case_name: Caterpillar
# case_name: Ignatius
# case_name: Meetingroom
case_name: rusbuild
root_dir: /home/admin2/dataset/gauu/COLMAP_RESULT/SMBU_COLMAP
#root_dir: /home/admin2/dataset/gauu/COLMAP_RESULT/CUHK_UPPER_CAMPUS_COLMAP

pipeline:
  # num_cluster: 1
  # depth_ratio: 1.0
  # mesh_res: 1024
  # voxel_size: 0.004
  # sdf_trunc: 0.016
  # depth_trunc: 3.5

  num_cluster: 1
  depth_ratio: 0.0
  mesh_res: 1024
  voxel_size: 0.005
  sdf_trunc: 0.02
  depth_trunc: 100.0
  occlusion_awared_denom: false
dataset:
  use_alpha: False
  eval: False
  downsample: 0.2927
  type: iterable
  ncc_scale: ${dataset.downsample}
  metric3d_normal_root: /home/admin2/dataset/gauu/COLMAP_RESULT/SMBU_COLMAP/mono_normals_undistorted_0.2927
  metric3d_depth: /home/admin2/dataset/gauu/COLMAP_RESULT/SMBU_COLMAP/mono_depths

optimizer:
  iterations: 60000
  position_lr_max_steps: 60000
  densification_interval: 800
  opacity_reset_interval: 6000
  densify_from_iter: 5000
  multi_view_weight_from_iter: 40000
  multi_view_weight_until_iter: 48000
  normal_from_iter: 30000
  normal_until_iter: 48000
  dist_from_iter: 15000
  depth_from: 60000
  depth_until: 60000
  densify_until_iter: 40000
  percent_dense: 0.0005
  multi_view_ncc_weight: 0.0 # 0.15
  multi_view_geo_weight: 0.0
  densify_grad_threshold: 0.2
  curvature_clamp_threshold: -5.0
  lambda_dist: 0.0
  reset_opacity_densify_delay: 1
  lambda_normal: 0.05
  lambda_metric_normal: 0.01
  lambda_depth_init: 0.5
  pro_until_iter: 28000

model_path: /home/admin2/dataset/gauu/COLMAP_RESULT/SMBU_COLMAP/dep0/${pipeline.depth_ratio}_${optimizer.densify_grad_threshold}_CurvClamp=-5.0_Dist=0.0_Percendent=0.0001_multi_view_ncc_weight=0.0_lambda_normal=0.05_New_densifyInterval=600_normalFrom30000_densifyUntil48000_woMulti
# path to pre-trained model
load_model_path: ${model_path}
# load_model_path: ${root_dir}/${case_name}/exp/DepthRatio=1.0_DensifyGrad=0.1_CurvClamp=0.0_Dist=10.0_Percendent=0.0005_Train_Realease_ReTest_normalFrom30000

