defaults:
  - ./base.yaml

skip_train: True
skip_test: False
skip_mesh: Flase
skip_cull: False
render_path: False
# case_name: Barn
# case_name: Truck
# case_name: Caterpillar
# case_name: Ignatius
# case_name: Meetingroom
case_name: rusbuild
root_dir: /home/admin2/code/cityg2/CityGaussian/data/matrix_city/aerial/train/block_all
#root_dir: /home/admin2/dataset/gauu/COLMAP_RESULT/CUHK_UPPER_CAMPUS_COLMAP

pipeline:
  # num_cluster: 1
  # depth_ratio: 1.0
  # mesh_res: 1024
  # voxel_size: 0.004
  # sdf_trunc: 0.016
  # depth_trunc: 3.5

  num_cluster: 1
  depth_ratio: 1.0
  mesh_res: 1024
  voxel_size: 0.01
  sdf_trunc: 0.04
  depth_trunc: 5.0
  occlusion_awared_denom: false
dataset:
  use_alpha: False
  eval: True
  hold: 8
  downsample: 0.8334
  type: iterable
  ncc_scale: ${dataset.downsample}
  metric3d_normal_root: /home/admin2/code/cityg2/CityGaussian/data/matrix_city/aerial/train/block_all/mono_normals_1.2
  metric3d_depth: /home/admin2/code/cityg2/CityGaussian/data/matrix_city/aerial/train/block_all/estimated_depths

optimizer:
  iterations: 80000
  position_lr_max_steps: 80000
  densification_interval: 800
  opacity_reset_interval: 20000
  densify_from_iter: 5000
  multi_view_weight_from_iter: 38000
  multi_view_weight_until_iter: 42000  #time consuming!!!
  normal_from_iter: 30000
  normal_until_iter: 40000
  dist_from_iter: 15000
  depth_from: 000
  depth_until: 000
  densify_until_iter: 35000
  percent_dense: 0.0005
  multi_view_ncc_weight: 0.0 # 0.15
  multi_view_geo_weight: 0.0
  densify_grad_threshold: 0.18
  curvature_clamp_threshold: -5.0
  lambda_dist: 0.0
  reset_opacity_densify_delay: 1
  lambda_normal: 0.05
  lambda_metric_normal: 0.01
  lambda_depth_init: 0.5
  pro_until_iter: 28000

model_path: /home/admin2/code/cityg2/CityGaussian/data/matrix_city/aerial/train/block_all/from12
# path to pre-trained model
load_model_path: ${model_path}
# load_model_path: ${root_dir}/${case_name}/exp/DepthRatio=1.0_DensifyGrad=0.1_CurvClamp=0.0_Dist=10.0_Percendent=0.0005_Train_Realease_ReTest_normalFrom30000

