defaults:
  - ./base.yaml

skip_train: False
skip_test: False
skip_mesh: False
skip_cull: False
render_path: False
# case_name: Barn
# case_name: Truck
# case_name: Caterpillar
# case_name: Ignatius
# case_name: Meetingroom
case_name: build
root_dir: /home/admin2/dataset/us3d/sciart/sci-art-pixsfm/train/

pipeline:
  # num_cluster: 1
  # depth_ratio: 1.0
  # mesh_res: 1024
  # voxel_size: 0.004
  # sdf_trunc: 0.016
  # depth_trunc: 3.5

  num_cluster: 1
  depth_ratio: 1.0
  mesh_res: 1024
  voxel_size: 0.1
  sdf_trunc: 0.4
  depth_trunc: 100.0
  occlusion_awared_denom: false
dataset:
  use_alpha: False
  eval: False
  downsample: 0.25
  type: iterable
  ncc_scale: ${dataset.downsample}
  metric3d_normal_root: /home/admin2/dataset/us3d/sciart/sci-art-pixsfm/train/mono_normals_undistorted_0.25

optimizer:
  iterations: 60000
  position_lr_max_steps: 60000
  densification_interval: 800
  opacity_reset_interval: 6000
  densify_from_iter: 4000
  multi_view_weight_from_iter: 35000
  multi_view_weight_until_iter: 40000
  normal_from_iter: 30000
  normal_until_iter: 40000
  dist_from_iter: 15000
  densify_until_iter: 48000
  percent_dense: 0.0005  #yue xiao 会让 densify 很保守
  multi_view_ncc_weight: 0.0 # 0.15
  multi_view_geo_weight: 0.0
  densify_grad_threshold: 0.18
  curvature_clamp_threshold: -5.0
  lambda_dist: 0.0
  reset_opacity_densify_delay: 1
  lambda_normal: 0.05
  lambda_metric_normal: 0.05
  depth_from: 30000
  depth_until: 30000

model_path: /home/admin2/dataset/us3d/sciart/Sci-Art/01p
# path to pre-trained model
load_model_path: ${model_path}
# load_model_path: ${root_dir}/${case_name}/exp/DepthRatio=1.0_DensifyGrad=0.1_CurvClamp=0.0_Dist=10.0_Percendent=0.0005_Train_Realease_ReTest_normalFrom30000

# eval mesh
# dataset_GT_path: the path to directory containing xxx_trans.txt, xxx.ply, xxx.json, xxx_COLMAP_SfM.log
#dataset_GT_path: /home/zzy_group/data/public_data/TNT_GOF/GT/${case_name}
#traj_path: ${root_dir}/${case_name}_COLMAP_SfM.log
# mesh_ply_path: the path to directory containing mesh to evaluate
mesh_ply_path: ${load_model_path}/train/ours_60000/fuse_post.ply
eval_output_path: ${load_model_path}/train/ours_60000